openapi: 3.0.3
info:
  title: RenderHive API
  version: 0.1.0
  description: REST API for the RenderHive render farm management system.
paths:
  /api/jobs/:
    get:
      operationId: jobs_list
      description: |-
        ViewSet for listing, submitting, updating, and deleting jobs.

        Endpoints:
            ``GET    /api/jobs/``         — list all jobs, supports filtering.
            ``POST   /api/jobs/``         — submit a new job with nested layers.
            ``GET    /api/jobs/{id}/``    — retrieve full job detail with layers.
            ``PATCH  /api/jobs/{id}/``    — update priority or visible_name.
            ``DELETE /api/jobs/{id}/``    — delete a job and all its layers/tasks.
            ``POST   /api/jobs/{id}/pause/``  — pause the job.
            ``POST   /api/jobs/{id}/resume/`` — resume a paused job.
      parameters:
      - in: query
        name: department
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
          enum:
          - FAILED
          - FINISHED
          - PAUSED
          - PENDING
          - RUNNING
        description: |-
          * `PENDING` - Pending
          * `RUNNING` - Running
          * `FINISHED` - Finished
          * `FAILED` - Failed
          * `PAUSED` - Paused
      - in: query
        name: user
        schema:
          type: string
      tags:
      - jobs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobListList'
          description: ''
    post:
      operationId: jobs_create
      description: |-
        ViewSet for listing, submitting, updating, and deleting jobs.

        Endpoints:
            ``GET    /api/jobs/``         — list all jobs, supports filtering.
            ``POST   /api/jobs/``         — submit a new job with nested layers.
            ``GET    /api/jobs/{id}/``    — retrieve full job detail with layers.
            ``PATCH  /api/jobs/{id}/``    — update priority or visible_name.
            ``DELETE /api/jobs/{id}/``    — delete a job and all its layers/tasks.
            ``POST   /api/jobs/{id}/pause/``  — pause the job.
            ``POST   /api/jobs/{id}/resume/`` — resume a paused job.
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobCreate'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreate'
          description: ''
  /api/jobs/{job_pk}/layers/:
    get:
      operationId: jobs_layers_list
      description: |-
        Read-only ViewSet for listing and retrieving layers scoped to a job.

        Endpoints (nested under /api/jobs/{job_pk}/):
            ``GET  /api/jobs/{job_pk}/layers/``         — list all layers for a job.
            ``GET  /api/jobs/{job_pk}/layers/{id}/``    — retrieve a single layer.

        All endpoints require authentication. Layers are scoped to the parent job
        via the ``job_pk`` URL kwarg.
      parameters:
      - in: path
        name: job_pk
        schema:
          type: string
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - jobs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLayerListList'
          description: ''
  /api/jobs/{job_pk}/layers/{layer_pk}/tasks/:
    get:
      operationId: jobs_layers_tasks_list
      description: |-
        ViewSet for listing tasks and handling Worker state transition actions.

        List/retrieve endpoints are nested under a layer:
            ``GET  /api/jobs/{job_pk}/layers/{layer_pk}/tasks/``
            ``GET  /api/jobs/{job_pk}/layers/{layer_pk}/tasks/{id}/``

        State transition action endpoints are on the top-level ``/api/tasks/``
        router, identified by UUID only (no nesting required for Workers):
            ``POST /api/tasks/{id}/start/``
            ``POST /api/tasks/{id}/succeed/``
            ``POST /api/tasks/{id}/fail/``
            ``POST /api/tasks/{id}/skip/``
            ``POST /api/tasks/{id}/checkpoint/``
      parameters:
      - in: path
        name: job_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: layer_pk
        schema:
          type: string
          format: uuid
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
          enum:
          - CHECKPOINT
          - FAILED
          - READY
          - RUNNING
          - SKIPPED
          - SUCCEEDED
          - WAITING
        description: |-
          * `WAITING` - Waiting
          * `READY` - Ready
          * `RUNNING` - Running
          * `CHECKPOINT` - Checkpointing
          * `SUCCEEDED` - Succeeded
          * `FAILED` - Failed
          * `SKIPPED` - Skipped
      tags:
      - jobs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskListList'
          description: ''
  /api/jobs/{job_pk}/layers/{layer_pk}/tasks/{id}/:
    get:
      operationId: jobs_layers_tasks_retrieve
      description: |-
        ViewSet for listing tasks and handling Worker state transition actions.

        List/retrieve endpoints are nested under a layer:
            ``GET  /api/jobs/{job_pk}/layers/{layer_pk}/tasks/``
            ``GET  /api/jobs/{job_pk}/layers/{layer_pk}/tasks/{id}/``

        State transition action endpoints are on the top-level ``/api/tasks/``
        router, identified by UUID only (no nesting required for Workers):
            ``POST /api/tasks/{id}/start/``
            ``POST /api/tasks/{id}/succeed/``
            ``POST /api/tasks/{id}/fail/``
            ``POST /api/tasks/{id}/skip/``
            ``POST /api/tasks/{id}/checkpoint/``
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task.
        required: true
      - in: path
        name: job_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: layer_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
          description: ''
  /api/jobs/{job_pk}/layers/{layer_pk}/tasks/{id}/checkpoint/:
    post:
      operationId: jobs_layers_tasks_checkpoint_create
      description: |-
        Increment the checkpoint counter for a task in progress.

        Called by a Worker when it saves a resume checkpoint (e.g. a V-Ray
        ``.vrimg`` file). The task transitions to ``CHECKPOINT`` state to
        indicate that progress has been persisted.

        Args:
            request: HTTP request.
            pk: Task UUID.

        Returns:
            ``200 OK`` with the new checkpoint count.
            ``409 Conflict`` if the task is not in RUNNING or CHECKPOINT state.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task.
        required: true
      - in: path
        name: job_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: layer_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskDetail'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
          description: ''
  /api/jobs/{job_pk}/layers/{layer_pk}/tasks/{id}/fail/:
    post:
      operationId: jobs_layers_tasks_fail_create
      description: |-
        Mark a task as FAILED or retry it based on the retry budget.

        Increments the retry counter. If ``retries >= max_retries``, the task
        transitions to ``FAILED`` permanently. Otherwise it reverts to ``READY``
        for re-dispatch.

        Args:
            request: HTTP request containing ``exit_status``.
            pk: Task UUID.

        Returns:
            ``200 OK`` with the resulting state (``failed`` or ``retrying``).
            ``409 Conflict`` if the task is not in RUNNING or CHECKPOINT state.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task.
        required: true
      - in: path
        name: job_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: layer_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskFail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskFail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskFail'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskFail'
          description: ''
  /api/jobs/{job_pk}/layers/{layer_pk}/tasks/{id}/skip/:
    post:
      operationId: jobs_layers_tasks_skip_create
      description: |-
        Dismiss a failed task, allowing its dependents to proceed.

        Only available to staff users. Sets the task state to ``SKIPPED``,
        which (via signals) satisfies any dependencies blocked on this task.

        Args:
            request: HTTP request.
            pk: Task UUID.

        Returns:
            ``200 OK`` on success.
            ``403 Forbidden`` if the requesting user is not staff.
            ``409 Conflict`` if the task is not in FAILED state.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task.
        required: true
      - in: path
        name: job_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: layer_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskDetail'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
          description: ''
  /api/jobs/{job_pk}/layers/{layer_pk}/tasks/{id}/start/:
    post:
      operationId: jobs_layers_tasks_start_create
      description: |-
        Mark a task as RUNNING when a Worker begins execution.

        Records the Worker hostname and execution start timestamp. Only
        valid when the task is in ``READY`` state.

        Args:
            request: HTTP request containing ``worker_name``.
            pk: Task UUID.

        Returns:
            ``200 OK`` on success.
            ``409 Conflict`` if the task is not in READY state.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task.
        required: true
      - in: path
        name: job_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: layer_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskStart'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStart'
          description: ''
  /api/jobs/{job_pk}/layers/{layer_pk}/tasks/{id}/succeed/:
    post:
      operationId: jobs_layers_tasks_succeed_create
      description: |-
        Mark a task as SUCCEEDED and record telemetry.

        Transitions state, logs exit code and stop timestamp.
        Returns 409 if the task isn't currently running/checkpointing.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this task.
        required: true
      - in: path
        name: job_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: layer_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskSucceed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskSucceed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskSucceed'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSucceed'
          description: ''
  /api/jobs/{job_pk}/layers/{id}/:
    get:
      operationId: jobs_layers_retrieve
      description: |-
        Read-only ViewSet for listing and retrieving layers scoped to a job.

        Endpoints (nested under /api/jobs/{job_pk}/):
            ``GET  /api/jobs/{job_pk}/layers/``         — list all layers for a job.
            ``GET  /api/jobs/{job_pk}/layers/{id}/``    — retrieve a single layer.

        All endpoints require authentication. Layers are scoped to the parent job
        via the ``job_pk`` URL kwarg.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: job_pk
        schema:
          type: string
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerDetail'
          description: ''
  /api/jobs/{id}/:
    get:
      operationId: jobs_retrieve
      description: |-
        ViewSet for listing, submitting, updating, and deleting jobs.

        Endpoints:
            ``GET    /api/jobs/``         — list all jobs, supports filtering.
            ``POST   /api/jobs/``         — submit a new job with nested layers.
            ``GET    /api/jobs/{id}/``    — retrieve full job detail with layers.
            ``PATCH  /api/jobs/{id}/``    — update priority or visible_name.
            ``DELETE /api/jobs/{id}/``    — delete a job and all its layers/tasks.
            ``POST   /api/jobs/{id}/pause/``  — pause the job.
            ``POST   /api/jobs/{id}/resume/`` — resume a paused job.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this job.
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
          description: ''
    patch:
      operationId: jobs_partial_update
      description: |-
        ViewSet for listing, submitting, updating, and deleting jobs.

        Endpoints:
            ``GET    /api/jobs/``         — list all jobs, supports filtering.
            ``POST   /api/jobs/``         — submit a new job with nested layers.
            ``GET    /api/jobs/{id}/``    — retrieve full job detail with layers.
            ``PATCH  /api/jobs/{id}/``    — update priority or visible_name.
            ``DELETE /api/jobs/{id}/``    — delete a job and all its layers/tasks.
            ``POST   /api/jobs/{id}/pause/``  — pause the job.
            ``POST   /api/jobs/{id}/resume/`` — resume a paused job.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this job.
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJobPatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedJobPatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedJobPatch'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPatch'
          description: ''
    delete:
      operationId: jobs_destroy
      description: |-
        ViewSet for listing, submitting, updating, and deleting jobs.

        Endpoints:
            ``GET    /api/jobs/``         — list all jobs, supports filtering.
            ``POST   /api/jobs/``         — submit a new job with nested layers.
            ``GET    /api/jobs/{id}/``    — retrieve full job detail with layers.
            ``PATCH  /api/jobs/{id}/``    — update priority or visible_name.
            ``DELETE /api/jobs/{id}/``    — delete a job and all its layers/tasks.
            ``POST   /api/jobs/{id}/pause/``  — pause the job.
            ``POST   /api/jobs/{id}/resume/`` — resume a paused job.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this job.
        required: true
      tags:
      - jobs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '204':
          description: No response body
  /api/jobs/{id}/pause/:
    post:
      operationId: jobs_pause_create
      description: |-
        Pause a job, preventing new tasks from being dispatched.

        Sets ``is_paused=True`` on the job. Does not terminate currently
        running tasks — they will complete their current render.

        Args:
            request: The HTTP request.
            pk: The Job UUID.

        Returns:
            A ``200 OK`` response with the updated job state.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this job.
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobDetail'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
          description: ''
  /api/jobs/{id}/resume/:
    post:
      operationId: jobs_resume_create
      description: |-
        Resume a paused job, allowing tasks to be dispatched again.

        Sets ``is_paused=False`` on the job.

        Args:
            request: The HTTP request.
            pk: The Job UUID.

        Returns:
            A ``200 OK`` response with the updated job state.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this job.
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobDetail'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
          description: ''
  /api/pools/:
    get:
      operationId: pools_list
      description: ViewSet for listing, creating, and managing worker pools.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - pools
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkerPoolList'
          description: ''
    post:
      operationId: pools_create
      description: ViewSet for listing, creating, and managing worker pools.
      tags:
      - pools
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerPool'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkerPool'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkerPool'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerPool'
          description: ''
  /api/pools/{id}/:
    get:
      operationId: pools_retrieve
      description: ViewSet for listing, creating, and managing worker pools.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this worker pool.
        required: true
      tags:
      - pools
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerPool'
          description: ''
    put:
      operationId: pools_update
      description: ViewSet for listing, creating, and managing worker pools.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this worker pool.
        required: true
      tags:
      - pools
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerPool'
