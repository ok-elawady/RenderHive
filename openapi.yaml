components:
  schemas:
    AccessLevelEnum:
      enum:
      - Superuser
      - Staff
      - Client
      type: string
      description: |-
        * `Superuser` - Superuser
        * `Staff` - Staff
        * `Client` - Client
    JobCreate:
      type: object
      description: |-
        Write-only serializer for job submission.

        Accepts a nested ``layers`` array. The ``name`` field is auto-generated
        by the service layer if not provided. The ``submitted_by`` field is
        populated from the authenticated session user if available.

        Attributes:
            layers: Nested list of layer data (required, at least one).
            visible_name: Human-readable label for the job.
            project: Active show or production segment.
            department: Department name.
            user: Submitter's display name.
            priority: Dispatch priority (1-100).
            log_directory: Absolute path for task logs.
            max_tasks_per_worker: Concurrent tasks per Worker limit.
      properties:
        visible_name:
          type: string
          maxLength: 255
        project:
          type: string
          maxLength: 64
        department:
          type: string
          maxLength: 64
        user:
          type: string
          description: The submitter's display name. Defaults to the OS username in
            the DCC plugin but is manually editable. Matches Deadline's UserName field.
          maxLength: 64
        priority:
          type: integer
          maximum: 100
          minimum: 1
        log_directory:
          type: string
          maxLength: 2048
        max_tasks_per_worker:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Max concurrent tasks per worker
          description: Limits how many tasks from this job a single machine can run
            at once. Used to prevent a single job from monopolizing nodes with high
            core counts.
        included_pools:
          type: array
          items:
            type: string
            format: uuid
          description: If specified, only workers in these pools can process this
            job.
        excluded_pools:
          type: array
          items:
            type: string
            format: uuid
          description: If specified, workers in these pools are strictly prevented
            from processing this job.
        layers:
          type: array
          items:
            $ref: '#/components/schemas/LayerCreate'
      required:
      - layers
      - log_directory
      - project
      - user
    JobDetail:
      type: object
      description: |-
        Full read-only job representation for detail views.

        Extends :class:`JobListSerializer` with nested layers, log directory,
        worker concurrency limit, and stop timestamp.

        Attributes:
            layers: Nested list of all layers belonging to this job.
            log_directory: Absolute path for task logs.
            max_tasks_per_worker: Concurrent tasks per Worker limit.
            stopped_at: Timestamp when job reached FINISHED or FAILED.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        visible_name:
          type: string
          readOnly: true
        project:
          type: string
          readOnly: true
        department:
          type: string
          readOnly: true
        user:
          type: string
          readOnly: true
          description: The submitter's display name. Defaults to the OS username in
            the DCC plugin but is manually editable. Matches Deadline's UserName field.
        state:
          allOf:
          - $ref: '#/components/schemas/State1dfEnum'
          readOnly: true
        priority:
          type: integer
          readOnly: true
        is_paused:
          type: boolean
          readOnly: true
        total_tasks:
          type: integer
          readOnly: true
        waiting_tasks:
          type: integer
          readOnly: true
        ready_tasks:
          type: integer
          readOnly: true
        running_tasks:
          type: integer
          readOnly: true
        succeeded_tasks:
          type: integer
          readOnly: true
        failed_tasks:
          type: integer
          readOnly: true
        skipped_tasks:
          type: integer
          readOnly: true
        depend_tasks:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        included_pools:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
          description: If specified, only workers in these pools can process this
            job.
        excluded_pools:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
          description: If specified, workers in these pools are strictly prevented
            from processing this job.
        layers:
          type: array
          items:
            $ref: '#/components/schemas/LayerDetail'
          readOnly: true
        log_directory:
          type: string
          readOnly: true
        max_tasks_per_worker:
          type: integer
          readOnly: true
          title: Max concurrent tasks per worker
          description: Limits how many tasks from this job a single machine can run
            at once. Used to prevent a single job from monopolizing nodes with high
            core counts.
        stopped_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - department
      - depend_tasks
      - excluded_pools
      - failed_tasks
      - id
      - included_pools
      - is_paused
      - layers
      - log_directory
      - max_tasks_per_worker
      - name
      - priority
      - project
      - ready_tasks
      - running_tasks
      - skipped_tasks
      - state
      - stopped_at
      - succeeded_tasks
      - total_tasks
      - updated_at
      - user
      - visible_name
      - waiting_tasks
    JobList:
      type: object
      description: |-
        Slim read-only job representation for list views.

        Attributes:
            id: UUID primary key.
            name: System-generated stable identifier.
            visible_name: Human-readable label.
            project: Active show or production segment.
            department: Department name.
            user: Submitter's display name.
