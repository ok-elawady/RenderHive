      - title_role
    WorkerNode:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        hostname:
          type: string
          maxLength: 255
        ip_address:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        pools:
          type: array
          items:
            $ref: '#/components/schemas/WorkerPool'
          readOnly: true
        tags:
          type: array
          items:
            type: string
            maxLength: 64
        cores:
          type: integer
          maximum: 2147483647
          minimum: 0
        memory_mb:
          type: integer
          maximum: 2147483647
          minimum: 0
        gpu_models:
          type: array
          items:
            type: string
            maxLength: 128
        system_info:
          description: Transient and live utilization metrics.
        last_ping:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - hostname
      - id
      - last_ping
      - pools
    WorkerPool:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 128
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
  securitySchemes:
    XSessionTokenAuth:
      type: apiKey
      in: header
      name: X-Session-Token
      description: X-Session-Token authentication
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
