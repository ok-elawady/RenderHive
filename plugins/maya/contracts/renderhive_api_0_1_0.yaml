components:
  schemas:
    FrameDetail:
      type: object
      description: |-
        Full read-only frame representation for detail and Worker poll views.

        Extends :class:`FrameListSerializer` with execution telemetry fields.

        Attributes:
            max_memory_used_mb: Peak RSS memory in MB.
            cores_used: CPU cores reserved at dispatch time.
            checkpoint_count: Number of resume checkpoints saved.
            dispatch_order: Dispatch priority within the layer.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        number:
          type: integer
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/State23dEnum'
          readOnly: true
        depend_count:
          type: integer
          readOnly: true
          title: Dependency count
        retries:
          type: integer
          readOnly: true
        worker_name:
          type: string
          readOnly: true
          nullable: true
          title: Worker hostname
        exit_status:
          type: integer
          readOnly: true
          description: Raw process exit code returned by the worker. -1 means the
            frame has not completed.
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        stopped_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        max_memory_used_mb:
          type: integer
          readOnly: true
          title: Peak memory used (MB)
        cores_used:
          type: integer
          readOnly: true
          nullable: true
        checkpoint_count:
          type: integer
          readOnly: true
          description: How many times the worker has reported saving intermediate
            progress (useful for resuming aborted frames).
        dispatch_order:
          type: integer
          readOnly: true
          description: Scheduler priority within the layer. Lower numbers are dispatched
            first.
      required:
      - checkpoint_count
      - cores_used
      - depend_count
      - dispatch_order
      - exit_status
      - id
      - max_memory_used_mb
      - name
      - number
      - retries
      - started_at
      - state
      - stopped_at
      - worker_name
    FrameFail:
      type: object
      description: |-
        Validates payload when a Worker reports a frame as FAILED.

        Attributes:
            exit_status: Non-zero process exit code.
      properties:
        exit_status:
          type: integer
          description: Non-zero process exit code from the render process.
      required:
      - exit_status
    FrameList:
      type: object
      description: |-
        Slim read-only frame representation for list views.

        Attributes:
            id: UUID primary key.
            name: Display name (e.g. 'beauty_0042').
            number: Render frame index.
            state: Current execution state.
            depend_count: Number of unresolved dependencies.
            retries: Execution attempt count.
            worker_name: Hostname of the executing Worker.
            exit_status: Process exit code (-1 if not yet run).
            started_at: Execution start timestamp.
            stopped_at: Execution stop timestamp.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        number:
          type: integer
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/State23dEnum'
          readOnly: true
        depend_count:
          type: integer
          readOnly: true
          title: Dependency count
        retries:
          type: integer
          readOnly: true
        worker_name:
          type: string
          readOnly: true
          nullable: true
          title: Worker hostname
        exit_status:
          type: integer
          readOnly: true
          description: Raw process exit code returned by the worker. -1 means the
            frame has not completed.
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        stopped_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - depend_count
      - exit_status
      - id
      - name
      - number
      - retries
      - started_at
      - state
      - stopped_at
      - worker_name
    FrameStart:
      type: object
      description: |-
        Validates payload when a Worker marks a frame as RUNNING.

        Attributes:
            worker_name: Hostname of the Worker claiming this frame.
      properties:
        worker_name:
          type: string
          description: Hostname of the Worker claiming this frame.
          maxLength: 256
      required:
      - worker_name
    FrameSucceed:
      type: object
      description: |-
        Validates payload when a Worker reports a frame as SUCCEEDED.

        Attributes:
            exit_status: Process exit code (should be 0).
            max_memory_used_mb: Peak RSS memory in MB.
            cores_used: Actual CPU cores used.
      properties:
        exit_status:
          type: integer
          default: 0
          description: Process exit code. Should be 0 on success.
        max_memory_used_mb:
          type: integer
          minimum: 0
          default: 0
          description: Peak RSS memory used by the render process, in MB.
        cores_used:
          type: integer
          minimum: 1
          nullable: true
          description: Actual CPU cores reserved by the Worker at dispatch time.
    JobCreate:
      type: object
      description: |-
        Write-only serializer for job submission.

        Accepts a nested ``layers`` array. The ``name`` field is auto-generated
        by the service layer if not provided. The ``submitted_by`` field is
        populated from the authenticated session user if available.

        Attributes:
            layers: Nested list of layer data (required, at least one).
            visible_name: Human-readable label for the job.
            project: Active show or production segment.
            department: Department name.
            user: Submitter's display name.
            priority: Dispatch priority (1-100).
            log_directory: Absolute path for frame logs.
            max_frames_per_worker: Concurrent frames per Worker limit.
      properties:
        visible_name:
          type: string
          maxLength: 255
        project:
          type: string
          maxLength: 64
        department:
          type: string
          maxLength: 64
        user:
          type: string
          description: The submitter's display name. Defaults to the OS username in
            the DCC plugin but is manually editable. Matches Deadline's UserName field.
          maxLength: 64
        priority:
          type: integer
          maximum: 100
          minimum: 1
        log_directory:
          type: string
          maxLength: 2048
        max_frames_per_worker:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Max concurrent frames per worker
          description: Limits how many frames from this job a single machine can run
            at once. Used to prevent a single job from monopolizing nodes with high
            core counts.
        layers:
          type: array
          items:
            $ref: '#/components/schemas/LayerCreate'
      required:
      - layers
      - log_directory
      - project
      - user
    JobDetail:
      type: object
      description: |-
        Full read-only job representation for detail views.

        Extends :class:`JobListSerializer` with nested layers, log directory,
        worker concurrency limit, and stop timestamp.

        Attributes:
            layers: Nested list of all layers belonging to this job.
            log_directory: Absolute path for frame logs.
            max_frames_per_worker: Concurrent frames per Worker limit.
            stopped_at: Timestamp when job reached FINISHED or FAILED.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        visible_name:
          type: string
          readOnly: true
        project:
          type: string
          readOnly: true
        department:
          type: string
          readOnly: true
        user:
          type: string
          readOnly: true
          description: The submitter's display name. Defaults to the OS username in
            the DCC plugin but is manually editable. Matches Deadline's UserName field.
        state:
          allOf:
          - $ref: '#/components/schemas/State1dfEnum'
          readOnly: true
        priority:
          type: integer
          readOnly: true
        is_paused:
          type: boolean
          readOnly: true
        total_frames:
          type: integer
          readOnly: true
        waiting_frames:
          type: integer
          readOnly: true
        ready_frames:
          type: integer
          readOnly: true
        running_frames:
          type: integer
          readOnly: true
        succeeded_frames:
          type: integer
          readOnly: true
        failed_frames:
          type: integer
          readOnly: true
        skipped_frames:
          type: integer
          readOnly: true
        depend_frames:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        layers:
          type: array
          items:
            $ref: '#/components/schemas/LayerDetail'
          readOnly: true
        log_directory:
          type: string
          readOnly: true
        max_frames_per_worker:
          type: integer
          readOnly: true
          title: Max concurrent frames per worker
          description: Limits how many frames from this job a single machine can run
            at once. Used to prevent a single job from monopolizing nodes with high
            core counts.
        stopped_at:
          type: string
          format: date-time
