openapi: 3.0.3
info:
  title: RenderHive API
  version: 0.1.0
  description: REST API for the RenderHive render farm management system.
paths:
  /api/frames/:
    get:
      operationId: frames_list
      description: |-
        ViewSet for listing frames and handling Worker state transition actions.

        List/retrieve endpoints are nested under a layer:
            ``GET  /api/jobs/{job_pk}/layers/{layer_pk}/frames/``
            ``GET  /api/jobs/{job_pk}/layers/{layer_pk}/frames/{id}/``

        State transition action endpoints are on the top-level ``/api/frames/``
        router, identified by UUID only (no nesting required for Workers):
            ``POST /api/frames/{id}/start/``
            ``POST /api/frames/{id}/succeed/``
            ``POST /api/frames/{id}/fail/``
            ``POST /api/frames/{id}/skip/``
            ``POST /api/frames/{id}/checkpoint/``
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: state
        schema:
          type: string
          enum:
          - CHECKPOINT
          - FAILED
          - READY
          - RUNNING
          - SKIPPED
          - SUCCEEDED
          - WAITING
        description: |-
          * `WAITING` - Waiting
          * `READY` - Ready
          * `RUNNING` - Running
          * `CHECKPOINT` - Checkpointing
          * `SUCCEEDED` - Succeeded
          * `FAILED` - Failed
          * `SKIPPED` - Skipped
      tags:
      - frames
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFrameListList'
          description: ''
  /api/frames/{id}/:
    get:
      operationId: frames_retrieve
      description: |-
        ViewSet for listing frames and handling Worker state transition actions.

        List/retrieve endpoints are nested under a layer:
            ``GET  /api/jobs/{job_pk}/layers/{layer_pk}/frames/``
            ``GET  /api/jobs/{job_pk}/layers/{layer_pk}/frames/{id}/``

        State transition action endpoints are on the top-level ``/api/frames/``
        router, identified by UUID only (no nesting required for Workers):
            ``POST /api/frames/{id}/start/``
            ``POST /api/frames/{id}/succeed/``
            ``POST /api/frames/{id}/fail/``
            ``POST /api/frames/{id}/skip/``
            ``POST /api/frames/{id}/checkpoint/``
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this frame.
        required: true
      tags:
      - frames
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameDetail'
          description: ''
  /api/frames/{id}/checkpoint/:
    post:
      operationId: frames_checkpoint_create
      description: |-
        Increment the checkpoint counter for a frame in progress.

        Called by a Worker when it saves a resume checkpoint (e.g. a V-Ray
        ``.vrimg`` file). The frame transitions to ``CHECKPOINT`` state to
        indicate that progress has been persisted.

        Args:
            request: HTTP request.
            pk: Frame UUID.

        Returns:
            ``200 OK`` with the new checkpoint count.
            ``409 Conflict`` if the frame is not in RUNNING or CHECKPOINT state.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this frame.
        required: true
      tags:
      - frames
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FrameDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FrameDetail'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameDetail'
          description: ''
  /api/frames/{id}/fail/:
    post:
      operationId: frames_fail_create
      description: |-
        Mark a frame as FAILED or retry it based on the retry budget.

        Increments the retry counter. If ``retries >= max_retries``, the frame
        transitions to ``FAILED`` permanently. Otherwise it reverts to ``READY``
        for re-dispatch.

        Args:
            request: HTTP request containing ``exit_status``.
            pk: Frame UUID.

        Returns:
            ``200 OK`` with the resulting state (``failed`` or ``retrying``).
            ``409 Conflict`` if the frame is not in RUNNING or CHECKPOINT state.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this frame.
        required: true
      tags:
      - frames
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameFail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FrameFail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FrameFail'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameFail'
          description: ''
  /api/frames/{id}/skip/:
    post:
      operationId: frames_skip_create
      description: |-
        Dismiss a failed frame, allowing its dependents to proceed.

        Only available to staff users. Sets the frame state to ``SKIPPED``,
        which (via signals) satisfies any dependencies blocked on this frame.

        Args:
            request: HTTP request.
            pk: Frame UUID.

        Returns:
            ``200 OK`` on success.
            ``403 Forbidden`` if the requesting user is not staff.
            ``409 Conflict`` if the frame is not in FAILED state.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this frame.
        required: true
      tags:
      - frames
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FrameDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FrameDetail'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameDetail'
          description: ''
  /api/frames/{id}/start/:
    post:
      operationId: frames_start_create
      description: |-
        Mark a frame as RUNNING when a Worker begins execution.

        Records the Worker hostname and execution start timestamp. Only
        valid when the frame is in ``READY`` state.

        Args:
            request: HTTP request containing ``worker_name``.
            pk: Frame UUID.

        Returns:
            ``200 OK`` on success.
            ``409 Conflict`` if the frame is not in READY state.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this frame.
        required: true
      tags:
      - frames
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FrameStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FrameStart'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameStart'
          description: ''
  /api/frames/{id}/succeed/:
    post:
      operationId: frames_succeed_create
      description: |-
        Mark a frame as SUCCEEDED and record telemetry.

        Transitions state, logs exit code and stop timestamp.
        Returns 409 if the frame isn't currently running/checkpointing.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this frame.
        required: true
      tags:
      - frames
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameSucceed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FrameSucceed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FrameSucceed'
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameSucceed'
          description: ''
  /api/frames/dispatch/:
    post:
      operationId: frames_dispatch_create
      description: Atomically find, lock, and dispatch a READY frame to a worker.
      tags:
      - frames
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FrameStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FrameStart'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameStart'
          description: ''
  /api/jobs/:
    get:
      operationId: jobs_list
      description: |-
        ViewSet for listing, submitting, updating, and deleting jobs.

        Endpoints:
            ``GET    /api/jobs/``         — list all jobs, supports filtering.
            ``POST   /api/jobs/``         — submit a new job with nested layers.
            ``GET    /api/jobs/{id}/``    — retrieve full job detail with layers.
            ``PATCH  /api/jobs/{id}/``    — update priority or visible_name.
            ``DELETE /api/jobs/{id}/``    — delete a job and all its layers/frames.
            ``POST   /api/jobs/{id}/pause/``  — pause the job.
            ``POST   /api/jobs/{id}/resume/`` — resume a paused job.
      parameters:
      - in: query
        name: department
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
          enum:
          - FAILED
          - FINISHED
          - PAUSED
          - PENDING
          - RUNNING
        description: |-
          * `PENDING` - Pending
          * `RUNNING` - Running
          * `FINISHED` - Finished
          * `FAILED` - Failed
          * `PAUSED` - Paused
      - in: query
        name: user
        schema:
          type: string
      tags:
      - jobs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobListList'
          description: ''
    post:
      operationId: jobs_create
      description: |-
        ViewSet for listing, submitting, updating, and deleting jobs.

        Endpoints:
            ``GET    /api/jobs/``         — list all jobs, supports filtering.
            ``POST   /api/jobs/``         — submit a new job with nested layers.
            ``GET    /api/jobs/{id}/``    — retrieve full job detail with layers.
            ``PATCH  /api/jobs/{id}/``    — update priority or visible_name.
            ``DELETE /api/jobs/{id}/``    — delete a job and all its layers/frames.
            ``POST   /api/jobs/{id}/pause/``  — pause the job.
            ``POST   /api/jobs/{id}/resume/`` — resume a paused job.
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobCreate'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreate'
          description: ''
  /api/jobs/{job_pk}/layers/:
    get:
      operationId: jobs_layers_list
      description: |-
        Read-only ViewSet for listing and retrieving layers scoped to a job.

        Endpoints (nested under /api/jobs/{job_pk}/):
            ``GET  /api/jobs/{job_pk}/layers/``         — list all layers for a job.
            ``GET  /api/jobs/{job_pk}/layers/{id}/``    — retrieve a single layer.

        All endpoints require authentication. Layers are scoped to the parent job
        via the ``job_pk`` URL kwarg.
      parameters:
      - in: path
        name: job_pk
        schema:
          type: string
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - jobs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLayerListList'
          description: ''
